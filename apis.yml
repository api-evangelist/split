apis:
- aid: split:split-admin-api
  name: Split Admin API
  description: >-
    The Split Admin API is a REST API that enables programmatic management of workspaces (projects), environments,
    traffic types, attributes, users, groups, API keys, and change requests within the Split platform
    (now Harness Feature Management and Experimentation). The API uses resource-oriented URLs, returns
    JSON responses, and requires Admin API keys for authentication. All endpoints are prefixed with /internal/api/v2
    on the api.split.io host.
  humanURL: https://docs.split.io/reference/introduction
  tags:
  - Administration
  - Experimentation
  - Feature Flags
  - Feature Management
  properties:
  - type: Documentation
    url: https://docs.split.io/reference/introduction
  - type: OpenAPI
    url: openapi/split-admin-api-openapi.yml
  - type: JSONStructure
    url: json-structure/split-feature-flag-structure.json
